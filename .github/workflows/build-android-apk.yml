name: Build Shattered PD 4.0.2 with Scroll of Debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
      - name: Download official v4.0.2 and Scroll of Debug
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/00-evan/shattered-pixel-dungeon/archive/refs/tags/v4.0.2.zip -o /tmp/game.zip
          curl -fL --retry 3 https://github.com/Zrp200/ScrollOfDebug/archive/refs/heads/master.zip -o /tmp/debug.zip
          mkdir -p /tmp/game /tmp/debug
          unzip -q /tmp/game.zip -d /tmp/game
          unzip -q /tmp/debug.zip -d /tmp/debug
          mv /tmp/game/shattered-pixel-dungeon-4.0.2 ./game-build
          mkdir -p game-build/core/src/main/java/com/zrp200/scrollofdebug
          cp /tmp/debug/ScrollOfDebug-master/*.java game-build/core/src/main/java/com/zrp200/scrollofdebug/
      - name: Apply integration modifications
        shell: python
        run: |
          from pathlib import Path
          root = Path("game-build")
          scene = root/"core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java"
          s = scene.read_text()
          anchor = "Dungeon.level.playLevelMusic();"
          assert s.count(anchor) == 1, "GameScene insertion point changed"
          s = s.replace(anchor, anchor + "\n\t\tcom.zrp200.scrollofdebug.ScrollOfDebug.handleDebug(true);", 1)
          scene.write_text(s)
          build = root/"build.gradle"
          s = build.read_text()
          old = "appPackageName = 'com.shatteredpixel.shatteredpixeldungeon'"
          assert old in s
          build.write_text(s.replace(old, "appPackageName = 'com.shatteredpixel.shatteredpixeldungeon.debugscroll'", 1))
          trie = root/"core/src/main/java/com/zrp200/scrollofdebug/PackageTrie.java"
          s = trie.read_text()
          marker = "    public static PackageTrie getClassesForPackage(String pckgname)"
          assert s.count(marker) == 1, "PackageTrie insertion point changed"
          dex_support = """
              private static String androidApkPath;

              public static void setAndroidApkPath(String path) {
                  androidApkPath = path;
              }

              private static PackageTrie scanAndroidDex(String packageName) throws ClassNotFoundException {
                  PackageTrie root = new PackageTrie(packageName);
                  try {
                      Class<?> dexType = Class.forName("dalvik.system.DexFile");
                      Object dex = dexType.getConstructor(String.class).newInstance(androidApkPath);
                      try {
                          @SuppressWarnings("unchecked")
                          java.util.Enumeration<String> entries =
                                  (java.util.Enumeration<String>) dexType.getMethod("entries").invoke(dex);
                          ClassLoader loader = PackageTrie.class.getClassLoader();
                          while (entries.hasMoreElements()) {
                              String name = entries.nextElement();
                              if (!name.startsWith(packageName + ".")) continue;
                              try {
                                  Class<?> cls = Class.forName(name, false, loader);
                                  root.addClass(cls, packageName);
                              } catch (LinkageError | ClassNotFoundException | SecurityException ignored) {
                              }
                          }
                      } finally {
                          dexType.getMethod("close").invoke(dex);
                      }
                      return root;
                  } catch (Exception e) {
                      throw new ClassNotFoundException("Unable to scan Android APK dex classes", e);
                  }
              }

          """
          s = s.replace(marker, dex_support + marker, 1)
          marker2 = "            throws ClassNotFoundException {"
          start = s.index(marker, s.index(dex_support))
          pos = s.index(marker2, start) + len(marker2)
          s = s[:pos] + "\\n        if (androidApkPath != null) return scanAndroidDex(pckgname);" + s[pos:]
          trie.write_text(s)
          launcher = root/"android/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android/AndroidLauncher.java"
          s = launcher.read_text()
          marker = "super.onCreate(savedInstanceState);"
          assert s.count(marker) == 1
          launcher.write_text(s.replace(marker, marker + "\\n        com.zrp200.scrollofdebug.PackageTrie.setAndroidApkPath(getApplicationInfo().sourceDir);", 1))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile APK
        working-directory: game-build
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ShatteredPD-4.0.2-ScrollOfDebug-APK
          path: game-build/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
